name: publish

# Publishes to npm when a GitHub release is published, through npm's trusted publishing: npm trusts this workflow
# by name, so there is no npm token anywhere. To publish a release that already exists, run it on its tag:
# `gh workflow run publish.yml --ref v1.0.1`. The npm environment only lets release tags (v*) in.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from package.json "packageManager". Pinning it here as well makes
      # pnpm/action-setup abort with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 comes with npm 10.
      - run: npm install -g npm@11

      - name: The tag matches the version in package.json
        run: test "refs/tags/v$(node -p "require('./package.json').version")" = "$GITHUB_REF"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm size:guard

      # The checks above are prepublishOnly's, without verify:models: that one checks the 0.x planner's model ids
      # and needs an API key for each AI company.
      - run: npm publish --ignore-scripts
