<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | squad-kit v1</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #f6f8f7;
        --text: #0e1813;
        --muted: #536159;
        --mint: #7cffa0;
        --mint-ink: #03210f;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #050d09;
          --text: #e6f0ea;
          --muted: #95ae9f;
          color-scheme: dark;
        }
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--mint);
        color: var(--mint-ink);
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" width="56" height="56" />
      <h1>This page doesn't exist</h1>
      <p>The link may be old, or the address has a typo.</p>
      <a href="/">Go to the squad-kit v1 home page</a>
    </main>
  </body>
</html>
